<article class="order-step">
  <span class="order-step__number">
    {{ step() }}
  </span>

  <img
    class="order-step__image"
    [src]="image()"
    [alt]="title()"
  />

  <div class="order-step__content">
    <h3>{{ title() }}</h3>

    <p>
      {{ description() }}
    </p>
  </div>
</article>
