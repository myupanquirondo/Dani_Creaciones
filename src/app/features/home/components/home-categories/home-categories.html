
<section class="home-categories">
  <div class="home-categories__heading">
    <img
      class="home-categories__decoration"
      src="https://res.cloudinary.com/ll1rz1dd/image/upload/f_auto,q_auto,w_400/v1794957754/decoracion_rosa.webp"
      alt=""
      aria-hidden="true"
      loading="lazy"
      decoding="async"
    />

    <app-section-title
      title="¿Qué tipo de trabajo necesitas?"
      subtitle="Explora nuestras categorías y encuentra inspiración para tu próxima creación."
      [compact]="true"
    />

    <img
      class="home-categories__decoration"
      src="https://res.cloudinary.com/ll1rz1dd/image/upload/f_auto,q_auto,w_400/v1794957752/decoracion_amarilla.webp"
      alt=""
      aria-hidden="true"
      loading="lazy"
      decoding="async"
    />
  </div>

  <div class="home-categories__grid">
    @for (category of categories(); track category.id) {
      <a
        class="home-categories__card"
        [routerLink]="['/proyectos']"
        [queryParams]="{ categoria: category.slug }"
      >
        <div class="home-categories__icon">
          @switch (category.slug) {
            @case ('maquetas') {
              <img
                src="https://res.cloudinary.com/ll1rz1dd/image/upload/f_auto,q_auto,w_200/v1794958663/maquetas.webp"
                alt=""
                width="80"
                height="80"
                loading="lazy"
                decoding="async"
              />
            }

            @case ('tripticos') {
              <img
                src="https://res.cloudinary.com/ll1rz1dd/image/upload/f_auto,q_auto,w_200/v1794958673/tripticos.webp"
                alt=""
                width="80"
                height="80"
                loading="lazy"
                decoding="async"
              />
            }

            @case ('papelotes') {
              <img
                src="https://res.cloudinary.com/ll1rz1dd/image/upload/f_auto,q_auto,w_200/v1794958668/papelotes.webp"
                alt=""
                width="80"
                height="80"
                loading="lazy"
                decoding="async"
              />
            }

            @case ('manualidades') {
              <img
                src="https://res.cloudinary.com/ll1rz1dd/image/upload/f_auto,q_auto,w_200/v1794958662/manualidades.webp"
                alt=""
                width="80"
                height="80"
                loading="lazy"
                decoding="async"
              />
            }

            @case ('proyectos-de-ciencia') {
              <img
                src="https://res.cloudinary.com/ll1rz1dd/image/upload/f_auto,q_auto,w_200/v1794958671/proyectos_ciencia.webp"
                alt=""
                width="80"
                height="80"
                loading="lazy"
                decoding="async"
              />
            }

            @case ('carteles-y-afiches') {
              <img
                src="https://res.cloudinary.com/ll1rz1dd/image/upload/f_auto,q_auto,w_200/v1794535430/carteles_afiches.webp"
                alt=""
                width="80"
                height="80"
                loading="lazy"
                decoding="async"
              />
            }

            @default {
              <img
                src="https://res.cloudinary.com/ll1rz1dd/image/upload/f_auto,q_auto,w_200/v1794958666/otros.webp"
                alt=""
                width="80"
                height="80"
                loading="lazy"
                decoding="async"
              />
            }
          }
        </div>

        <span class="home-categories__name">
          {{ category.name }}
        </span>
      </a>
    }
  </div>
</section>
