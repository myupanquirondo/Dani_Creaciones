<section class="home-categories">
  <div class="home-categories__heading">
    <img
      class="home-categories__decoration"
      src="/images/categories/icons/decoracion_rosa.webp"
      alt=""
      aria-hidden="true"
    />

    <app-section-title
      title="¿Qué tipo de trabajo necesitas?"
      subtitle="Explora nuestras categorías y encuentra inspiración para tu próxima creación."
      [compact]="true"
    />

    <img
      class="home-categories__decoration"
      src="/images/categories/icons/decoracion_amarilla.webp"
      alt=""
      aria-hidden="true"
    />
  </div>

  <div class="home-categories__grid">
    @for (category of categories(); track category.id) {
      <a
        class="home-categories__card"
        [routerLink]="['/proyectos']"
        [queryParams]="{ categoria: category.slug }"
      >
        <div class="home-categories__icon">
          @switch (category.slug) {
            @case ('maquetas') {
              <img src="/images/categories/icons/maquetas.webp" alt="" />
            }

            @case ('tripticos') {
              <img src="/images/categories/icons/tripticos.webp" alt="" />
            }

            @case ('papelotes') {
              <img src="/images/categories/icons/papelotes.webp" alt="" />
            }

            @case ('manualidades') {
              <img src="/images/categories/icons/manualidades.webp" alt="" />
            }

            @case ('proyectos-de-ciencia') {
              <img src="/images/categories/icons/proyectos_ciencia.webp" alt="" />
            }

            @case ('carteles-y-afiches') {
              <img src="/images/categories/icons/carteles_afiches.webp" alt="" />
            }

            @default {
              <img src="/images/categories/icons/otros.webp" alt="" />
            }
          }
        </div>

        <span class="home-categories__name">
          {{ category.name }}
        </span>
      </a>
    }
  </div>
</section>
