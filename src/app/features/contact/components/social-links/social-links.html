<div class="social-links">
  @if (instagramUrl()) {
    <a
      [href]="instagramUrl()"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagram
    </a>
  }

  @if (tiktokUrl()) {
    <a
      [href]="tiktokUrl()"
      target="_blank"
      rel="noopener noreferrer"
    >
      TikTok
    </a>
  }
</div>
